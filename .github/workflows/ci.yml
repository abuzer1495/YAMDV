# YAMDV CI (S-SUP-07, §4.1). Read-only token, no secrets, no publishing, actions pinned by SHA.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  pure:
    name: pure crates (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: pure-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  windows:
    name: windows (gates + measurements)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/cargo-deny.exe
            target
          key: win-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: toolchain
        run: rustc -Vv
      - name: install cargo-deny
        shell: pwsh
        run: if (-not (Get-Command cargo-deny -ErrorAction SilentlyContinue)) { cargo install cargo-deny --version 0.20.2 --locked }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo deny check
      - name: release build
        run: cargo build --release --locked -p yamdv-app -p spikes
      - name: check-imports (S-NET-03, S-TEST-03)
        run: cargo xtask check-imports target/release/yamdv.exe
      - name: size (B-SIZE)
        run: cargo xtask size target/release/yamdv.exe
      - name: SegmentHeap variant build
        shell: pwsh
        env:
          YAMDV_SEGMENT_HEAP: "1"
        run: cargo build --release --locked -p yamdv-app -p spikes --target-dir target/seg
      - name: measurements (memprobe, spikes, screenshots)
        shell: pwsh
        run: ./.github/scripts/measure.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: measurements
          path: m/
          retention-days: 30
