# YAMDV CI (S-SUP-07, §4.1). Read-only token, no secrets, no publishing, actions pinned by SHA.
name: ci

on:
  push:
    branches: [main]
    tags: ['phase-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  pure:
    name: pure crates (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: pure-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: spec-check (F-03)
        run: cargo xtask spec-check

  windows:
    name: windows (gates + measurements)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/cargo-deny.exe
            target
          key: win-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: toolchain
        run: rustc -Vv
      - name: install cargo-deny
        shell: pwsh
        run: if (-not (Get-Command cargo-deny -ErrorAction SilentlyContinue)) { cargo install cargo-deny --version 0.20.2 --locked }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo deny check
      - name: release build
        run: cargo build --release --locked -p yamdv-app -p spikes
      - name: dev-tools build (render-png, autoscroll, mem-stats; never shipped)
        id: devbuild
        run: cargo build --release --locked -p yamdv-app --features dev-tools,mem-stats --target-dir target/dev
      - name: golden images (H.4)
        shell: pwsh
        run: |
          if (Test-Path tests/golden/002) { cargo xtask golden --exe target/dev/release/yamdv.exe --out m/golden }
          else { cargo xtask golden --exe target/dev/release/yamdv.exe --out m/golden; Write-Host "::warning::no committed goldens yet"; exit 0 }
      - name: ACG image decode matrix (prompt 004 §4.1.4)
        if: ${{ !cancelled() && steps.devbuild.outcome == 'success' }}
        shell: pwsh
        run: cargo xtask acg-matrix --exe target/dev/release/yamdv.exe --out m/acg | Tee-Object m/acg-matrix.md
      - name: in-window driver scripts (prompt 004 §4.5, AC-5)
        if: ${{ !cancelled() && steps.devbuild.outcome == 'success' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path m/driver | Out-Null
          $fail = 0
          $doc = (Resolve-Path tests/driver/a.md).Path
          foreach ($s in Get-ChildItem tests/driver/*.yds) {
            $p = Start-Process target/dev/release/yamdv.exe -ArgumentList '--script', $s.FullName, $doc -PassThru
            $null = $p.Handle
            if (-not $p.WaitForExit(30000)) { $p.Kill(); Write-Host "::error::$($s.Name) timed out"; $fail = 1; continue }
            if (Test-Path "$($s.FullName).log") { Get-Content "$($s.FullName).log"; Copy-Item "$($s.FullName).log" m/driver/ }
            if ($p.ExitCode -ne 0) { Write-Host "::error::$($s.Name) failed (exit $($p.ExitCode))"; $fail = 1 } else { Write-Host "$($s.Name): PASS" }
          }
          exit $fail
      - name: check-imports (S-NET-03, S-TEST-03)
        # Gates after the builds run even if an earlier gate failed, so one red gate never hides the others.
        if: ${{ !cancelled() && steps.devbuild.outcome == 'success' }}
        run: cargo xtask check-imports target/release/yamdv.exe
      - name: size (B-SIZE)
        # Gates after the builds run even if an earlier gate failed, so one red gate never hides the others.
        if: ${{ !cancelled() && steps.devbuild.outcome == 'success' }}
        run: cargo xtask size target/release/yamdv.exe
      - name: measurements + soft-budget gate (memprobe)
        # Gates after the builds run even if an earlier gate failed, so one red gate never hides the others.
        if: ${{ !cancelled() && steps.devbuild.outcome == 'success' }}
        shell: pwsh
        run: ./.github/scripts/measure.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: measurements
          path: m/
          retention-days: 30

  owner-kit:
    name: owner kit (F-05)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: kit-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo build --release --locked -p yamdv-app -p spikes -p xtask
      - name: assemble
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path kit/corpus | Out-Null
          Copy-Item target/release/yamdv.exe, target/release/xtask.exe, target/release/spike-a.exe kit/
          Copy-Item -Recurse tests/corpus/002/* kit/corpus/
          Copy-Item -Recurse tests/corpus/encodings kit/corpus/encodings
          & target/release/xtask.exe gen-large kit/corpus/large-1mb.md
          Copy-Item docs/OWNER_KIT.md kit/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owner-kit
          path: kit/
          retention-days: 14
