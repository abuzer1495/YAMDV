# YAMDV CI (S-SUP-07, §4.1). Read-only token, no secrets, no publishing, actions pinned by SHA.
name: ci

on:
  push:
    branches: [main]
    tags: ['phase-*', 'v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  pure:
    name: pure crates (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: pure-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: spec-check (F-03)
        run: cargo xtask spec-check

  windows:
    name: windows (gates + measurements)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/cargo-deny.exe
            target
          key: win-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: toolchain
        run: rustc -Vv
      - name: install cargo-deny
        shell: pwsh
        run: if (-not (Get-Command cargo-deny -ErrorAction SilentlyContinue)) { cargo install cargo-deny --version 0.20.2 --locked }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo deny check
      - name: release build
        run: cargo build --release --locked -p yamdv-app -p spikes
      - name: dev-tools build (render-png, autoscroll, mem-stats; never shipped)
        id: devbuild
        run: cargo build --release --locked -p yamdv-app --features dev-tools,mem-stats --target-dir target/dev
      - name: startup smoke (V2-B fix; --version, dev-tools start, crash note)
        if: ${{ !cancelled() && steps.devbuild.outcome == 'success' }}
        shell: pwsh
        run: ./.github/scripts/smoke.ps1
      - name: golden images (H.4)
        shell: pwsh
        run: |
          if (Test-Path tests/golden/002) { cargo xtask golden --exe target/dev/release/yamdv.exe --out m/golden }
          else { cargo xtask golden --exe target/dev/release/yamdv.exe --out m/golden; Write-Host "::warning::no committed goldens yet"; exit 0 }
      - name: window goldens (prompt 005 §4)
        if: ${{ !cancelled() && steps.devbuild.outcome == 'success' }}
        run: cargo xtask golden-shell --exe target/dev/release/yamdv.exe --out m/golden-shell
      - name: ACG image decode matrix (prompt 004 §4.1.4)
        if: ${{ !cancelled() && steps.devbuild.outcome == 'success' }}
        shell: pwsh
        run: cargo xtask acg-matrix --exe target/dev/release/yamdv.exe --out m/acg | Tee-Object m/acg-matrix.md
      - name: in-window driver scripts (prompt 004 §4.5, AC-5)
        if: ${{ !cancelled() && steps.devbuild.outcome == 'success' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path m/driver | Out-Null
          $fail = 0
          $doc = (Resolve-Path tests/driver/a.md).Path
          # export-progress (V2-B) opens ../fixtures/large-1mb.md (generated, not committed) and
          # runs ~30-page PDF jobs: it gets 300 s like in the owner test pack.
          if (-not (Test-Path tests/fixtures/large-1mb.md)) { cargo xtask gen-large tests/fixtures/large-1mb.md }
          foreach ($s in Get-ChildItem tests/driver/*.yds) {
            $env:APPDATA = $env:LOCALAPPDATA = (New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/prof-$($s.BaseName)").FullName
            $limit = if ($s.BaseName -eq 'export-progress') { 300000 } else { 30000 }
            $p = Start-Process target/dev/release/yamdv.exe -ArgumentList '--script', $s.FullName, $doc -PassThru
            $null = $p.Handle
            if (-not $p.WaitForExit($limit)) {
              $p.Kill(); Write-Host "::error::$($s.Name) timed out"; $fail = 1
              if (Test-Path "$($s.FullName).log") { Get-Content "$($s.FullName).log" | Where-Object { $_ -notlike 'dump *' } }
              continue
            }
            if (Test-Path "$($s.FullName).log") { Get-Content "$($s.FullName).log"; Copy-Item "$($s.FullName).log" m/driver/ }
            if ($p.ExitCode -ne 0) {
              Write-Host "::error::$($s.Name) failed (exit $($p.ExitCode))"; $fail = 1
              Get-ChildItem -Recurse -Filter 'crash-*.txt' -Path $env:LOCALAPPDATA -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName }
            } else { Write-Host "$($s.Name): PASS" }
          }
          exit $fail
      - name: V1-D headless export, PDF and install/uninstall checks (prompt 008 §6)
        if: ${{ !cancelled() && steps.devbuild.outcome == 'success' }}
        shell: pwsh
        run: ./.github/scripts/v1d-checks.ps1
      - name: check-imports (S-NET-03, S-TEST-03)
        # Gates after the builds run even if an earlier gate failed, so one red gate never hides the others.
        if: ${{ !cancelled() && steps.devbuild.outcome == 'success' }}
        run: cargo xtask check-imports target/release/yamdv.exe
      - name: size (B-SIZE, report only per A-5)
        if: ${{ !cancelled() && steps.devbuild.outcome == 'success' }}
        continue-on-error: true
        run: cargo xtask size target/release/yamdv.exe
      - name: measurements (gates M0, M1, T4 typical per A-5; rest report-only)
        # Gates after the builds run even if an earlier gate failed, so one red gate never hides the others.
        if: ${{ !cancelled() && steps.devbuild.outcome == 'success' }}
        shell: pwsh
        run: ./.github/scripts/measure.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: measurements
          path: m/
          retention-days: 30

  pack-build:
    # V2-B fix: the owner test pack is built with cargo-xwin on Linux (tools/testpack/build-pack.sh);
    # build the same exes here so the Windows job below can start them (build parity check).
    name: pack exes (cargo-xwin, ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/cargo-xwin
            ~/.cache/cargo-xwin
            target
          key: xwin-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: install cargo-xwin + lld
        run: |
          command -v cargo-xwin || cargo install cargo-xwin --version 0.23.1 --locked
          sudo apt-get install -y -qq lld llvm clang >/dev/null
      - name: build (same commands as build-pack.sh)
        run: |
          T=x86_64-pc-windows-msvc
          cargo xwin build --release --locked --target $T -p yamdv-app
          cargo xwin build --release --locked --target $T -p yamdv-app --features dev-tools,mem-stats --target-dir target/dev
          mkdir -p pack && cp target/$T/release/yamdv.exe pack/yamdv.exe && cp target/dev/$T/release/yamdv.exe pack/yamdv-dev.exe
      - name: diagnosis variants (hardening flags on/off; V2-B fix)
        run: ./.github/scripts/xwin-variants.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pack-exes
          path: pack/
          retention-days: 7

  pack-smoke:
    # windows-2022 (build 20348) is the closest runner to the owner's Windows 10 (19045).
    name: pack exes start on ${{ matrix.os }} (startup smoke)
    needs: [pack-build]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pack-exes
          path: pack
      - name: startup smoke (pack exes)
        shell: pwsh
        run: ./.github/scripts/smoke.ps1 -Rel pack/yamdv.exe -Dev pack/yamdv-dev.exe
      - name: diagnosis variants
        if: always()
        shell: pwsh
        run: ./.github/scripts/variants-smoke.ps1

  owner-kit:
    name: owner kit (F-05)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: kit-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo build --release --locked -p yamdv-app -p spikes -p xtask
      - name: assemble
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path kit/corpus | Out-Null
          Copy-Item target/release/yamdv.exe, target/release/xtask.exe, target/release/spike-a.exe kit/
          Copy-Item -Recurse tests/corpus/002/* kit/corpus/
          Copy-Item -Recurse tests/corpus/encodings kit/corpus/encodings
          & target/release/xtask.exe gen-large kit/corpus/large-1mb.md
          Copy-Item docs/OWNER_KIT.md kit/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owner-kit
          path: kit/
          retention-days: 14

  release:
    # Prompt 008 §5.3 + A-5: on tag v1.0.0 build the zip + SHA-256 and create a DRAFT release.
    # Never published from CI (the owner publishes); the only job with write access.
    name: draft release (never published)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [pure, windows]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: rel-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo build --release --locked -p yamdv-app
      - name: assemble zip + SHA-256
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne $env:GITHUB_REF_NAME) { Write-Host "::error::tag $env:GITHUB_REF_NAME does not match version $v"; exit 1 }
          $name = "YAMDV-$v-win-x64"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/yamdv.exe, README.md, LICENSE, CHANGELOG.md "dist/$name/"
          Copy-Item docs/FUTURE.md "dist/$name/FUTURE.md"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip" -Force
          $h = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$h  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"
          Get-Content "dist/$name.zip.sha256"
          $cl = Get-Content CHANGELOG.md -Raw
          $notes = if ($cl -match "(?s)## \[$([regex]::Escape($v))\][^\n]*\n(.*?)(?=\n## \[|$)") { $Matches[1] } else { "YAMDV $v" }
          "$notes`n`nSHA-256: ``$h``" | Out-File -Encoding utf8 dist/notes.md
          "ZIP=dist/$name.zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: draft release (owner publishes)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A-5 (owner, 2026-10-17): the repository is public by owner decision; the release stays a
          # DRAFT (visible to collaborators only) until the owner publishes it. Never --draft=false here.
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $env:ZIP "$($env:ZIP).sha256" --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $env:ZIP "$($env:ZIP).sha256" --draft --verify-tag --title "YAMDV $tag" --notes-file dist/notes.md --repo $env:GITHUB_REPOSITORY
          }
          exit $LASTEXITCODE
