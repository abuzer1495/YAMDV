[package]
name = "spikes"
description = "Phase 001 rendering-backend spikes (§4.7). Throwaway measurement code; not part of the product."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "spike-a"
path = "src/bin/spike_a.rs"

[[bin]]
name = "spike-b"
path = "src/bin/spike_b.rs"

[[bin]]
name = "spike-c"
path = "src/bin/spike_c.rs"

[target.'cfg(windows)'.dependencies]
tiny-skia = { workspace = true }
windows-numerics = { workspace = true }
windows-core = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

# Spike-only lint table (ARCHITECTURE §E.9 vs. H14, see ADR-0002): spikes are throwaway FFI
# measurement harnesses, so `unsafe` is allowed without per-block SAFETY comments. They are never
# shipped and never linked into the product.
[lints.rust]
unsafe_code = "allow"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
